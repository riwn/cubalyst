# LAN 内向けの DNS（dnsmasq）の設定例（docs/lan.md の「名前で開く」を参照）。
# server.home.arpa 以下のすべての名前（cubalyst.server.home.arpa など）をサーバーに向け、
# それ以外はルーターの DNS に転送する。
#   192.168.1.10 → サーバーの LAN 側の IP アドレス
#   192.168.1.1  → 今まで使っていた DNS（多くはルーター）
#   server       → 名前の区切りに使う好きな名前（サーバーのホスト名など）
# /etc/dnsmasq-home-arpa.conf に置き、deploy/home-dns.service から読み込む。

# LAN 側のアドレスの 53 番だけで待ち受ける。
# systemd-resolved（127.0.0.53）とぶつからず、起動時にアドレスがまだ無くても後から待ち受ける
listen-address=192.168.1.10
bind-dynamic

# 問い合わせ先は下の server= だけにする（/etc/resolv.conf や /etc/hosts は読まない）
no-resolv
no-hosts
server=192.168.1.1

# server.home.arpa とその下のすべての名前をサーバーに向ける（ワイルドカード）
address=/server.home.arpa/192.168.1.10
# home.arpa のほかの名前は外に問い合わせず、ここで「無い」と答える
local=/home.arpa/

# ドットの無い名前や、プライベートアドレスの逆引きを外に転送しない
domain-needed
bogus-priv

cache-size=1000
# systemd が管理するので pid ファイルは作らない
pid-file=
